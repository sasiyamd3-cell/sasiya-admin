<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIYORA MD — Live Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial,sans-serif}header{padding:22px 24px;border-bottom:1px solid #1d2432;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#080b12eF;backdrop-filter:blur(12px);z-index:5}.brand{font-size:22px;font-weight:800}.brand span{color:#ff8fca}.pill{padding:8px 12px;border-radius:999px;background:#121827;color:#aab5cc;font-size:12px}.wrap{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.bot{background:#0d121c;border:1px solid #1b2433;border-radius:18px;padding:18px;box-shadow:0 12px 30px #0004}.label{font-size:12px;color:#8290a9;text-transform:uppercase;letter-spacing:.08em}.num{font-size:30px;font-weight:800;margin-top:8px}.section{margin-top:22px}.bots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.bottop{display:flex;justify-content:space-between;align-items:center}.status{font-size:11px;padding:6px 9px;border-radius:999px;background:#2a1621;color:#ff9bbf}.online{background:#12261d;color:#79e6a7}.botname{font-weight:800;font-size:18px}.muted{color:#7e8ba3;font-size:12px;margin-top:4px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.stat{background:#101725;border-radius:12px;padding:12px}.stat b{display:block;margin-top:5px;font-size:17px}.empty{padding:35px;text-align:center;color:#758198;border:1px dashed #263044;border-radius:16px}.err{color:#ff8c9d}.refresh{cursor:pointer;border:1px solid #273246;background:#111827;color:#dce4f5;padding:9px 12px;border-radius:10px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:16px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.brand{font-size:18px}}
</style></head><body>
<header><div class="brand">🌸 MIYORA <span>MD</span> — ADMIN</div><div><span id="db" class="pill">MongoDB connecting…</span> <button class="refresh" onclick="load()">↻ Refresh</button></div></header>
<div class="wrap"><div class="grid"><div class="card"><div class="label">Total Bots</div><div id="total" class="num">0</div></div><div class="card"><div class="label">Online</div><div id="online" class="num">0</div></div><div class="card"><div class="label">Offline</div><div id="offline" class="num">0</div></div><div class="card"><div class="label">Last Sync</div><div id="sync" class="num" style="font-size:18px">—</div></div></div>
<div class="section"><div class="label" style="margin:0 0 10px 3px">Live Bot Monitor</div><div id="bots" class="bots"><div class="empty">Waiting for MIYORA bot data…<br><small>Bot and Admin must use the same MongoDB database.</small></div></div></div></div>
<script>
function fmtTime(v){if(!v)return '—';return new Date(v).toLocaleTimeString()}
function fmtUptime(s){s=Number(s||0);let d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);let sec=s%60;return `${d?d+'d ':''}${h?String(h).padStart(2,'0')+':':''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
async function load(){try{let h=await fetch('/api/health');let hj=await h.json();document.getElementById('db').textContent=hj.ok?'● MongoDB Connected':'● MongoDB Error';document.getElementById('db').style.color=hj.ok?'#79e6a7':'#ff8c9d';let r=await fetch('/api/dashboard');let j=await r.json();if(!j.ok)throw Error(j.error);total.textContent=j.total;online.textContent=j.online;offline.textContent=j.offline;sync.textContent=new Date().toLocaleTimeString();bots.innerHTML=j.bots.length?j.bots.map(b=>`<div class="bot"><div class="bottop"><div><div class="botname">🌸 ${b.botName||'MIYORA MD'}</div><div class="muted">📱 ${b.botNumber||'Unknown'}</div></div><span class="status ${b.liveStatus==='online'?'online':''}">${b.liveStatus==='online'?'● ONLINE':'● OFFLINE'}</span></div><div class="stats"><div class="stat">Groups<b>${b.groups||0}</b></div><div class="stat">Users<b>${b.users||0}</b></div><div class="stat">Messages<b>${b.messages||0}</b></div><div class="stat">Speed<b>${b.speed||0} ms</b></div><div class="stat">Uptime<b>${fmtUptime(b.uptime)}</b></div><div class="stat">RAM<b>${b.memory||0} MB</b></div></div><div class="muted" style="margin-top:13px">Last seen: ${fmtTime(b.lastSeen)} · Updated: ${fmtTime(b.updatedAt)}</div></div>`).join(''):'<div class="empty">No bot telemetry found in <b>bot_telemetry</b>.</div>'}catch(e){document.getElementById('db').textContent='● Connection Error';bots.innerHTML='<div class="empty err">'+e.message+'</div>'}}
load();setInterval(load,5000);
</script></body></html>
